# repo-doctor config for this repo; schema in agentage/automation scripts/repo-doctor/README.md.
class: express-service
waive:
  - id: rb-published-files
    reason: 'no prepare-release: this repo never bumps; an extension made from it adds one with the release loop'
  - id: obs-kit
    reason: 'the extension kit owns the server, logs and /health (sealing); telemetry shipping lands in the kit'
  - id: be-migrations-ci
    reason: 'an extension never migrates from its own repo: the kit migrate job applies migrations/ in the local job (up) and in estate apply before each rollout; unit tests apply them to an in-process postgres'
  - id: cicd-release-artifact
    reason: 'release.yml publishes through `agentage extension release` (images, record on the GitHub release), not a literal publish command; the package is private'
