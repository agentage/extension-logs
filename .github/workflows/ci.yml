name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # src/api/clickhouse.test.ts runs the DDL, the insert and the reads against the real store.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_PASSWORD: ci
        ports: ['8123:8123']
        options: >-
          --health-cmd "clickhouse-client --password ci -q 'SELECT 1'"
          --health-interval 5s --health-retries 20
    env:
      CLICKHOUSE_URL: http://default:ci@localhost:8123
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Conformance (the kit's six rules; the store rule uses the runner's docker)
        run: node_modules/.bin/agentage extension check

  local:
    name: up and the e2e gate on local
    runs-on: ubuntu-latest
    # The gate on local stays under 10 minutes; slower is a regression.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (and Chromium for the widget test; the runner has its OS libraries)
        run: |
          npm ci
          npx playwright install chromium

      # agentage/e2e is private (the org PAT_TOKEN reads it); Dependabot and fork runs get no secrets.
      - name: Checkout agentage/e2e
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install agentage/e2e
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        run: |
          npm ci --prefix e2e-suite --no-audit --no-fund
          npx --prefix e2e-suite playwright install chromium

      # up has no clickhouse store kind yet (kit 0.11): the parts reach this one through the docker host.
      - name: ClickHouse 26.8 for the parts
        run: docker run -d --name logs-store -p 8123:8123 -e CLICKHOUSE_PASSWORD=local clickhouse/clickhouse-server:26.8

      # The cli and its kit come from this lockfile: a cli or kit patch needs a commit here.
      - name: agentage extension up (the release recipes, store, dev issuer, gateway)
        env:
          AGENTAGE_SECRET_STORE_URL: http://default:local@172.17.0.1:8123
        run: node_modules/.bin/agentage extension up

      - name: Ingest through the gateway lands in ClickHouse (p0 ingest, local)
        run: |
          set -euo pipefail
          # Ingest takes a svc_ subject: the dev issuer sets sub, the token command does not.
          T=$(curl -sf -H 'content-type: application/json' -d '{"scope":"logs:write","sub":"svc_ci"}' localhost:4281/token | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $(node_modules/.bin/agentage extension token --scope logs:write)" \
            -H 'content-type: application/json' -d '[]' localhost:4280/api/v1/events)
          echo "usr_ subject with logs:write: $code"; test "$code" = 403
          line="{\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"kind\":\"log\",\"msg\":\"ci ingest\",\"extension\":\"logs\",\"part\":\"ci\"}"
          curl -sf -H "authorization: Bearer $T" -H 'content-type: application/json' \
            -d "[$line,$line]" localhost:4280/api/v1/events | tee /dev/stderr | jq -e '.data == {accepted: 2, rejected: 0}'
          n=$(docker exec logs-store clickhouse-client --password local -q "SELECT count() FROM events WHERE msg = 'ci ingest'")
          echo "rows: $n"; test "$n" = 2

      - name: The widget a11y test through the local gateway (src/**/*.spec.ts)
        run: npm run test:e2e

      # Until agentage/e2e has the logs row the gate cannot run: a warning, never a silent pass.
      - name: The logs row in agentage/e2e
        id: row
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        run: |
          if jq -e '.[] | select(.id == "logs")' e2e-suite/extensions.json >/dev/null; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::agentage/e2e has no logs row yet: the gate on local did not run"
          fi

      # {ID}_DIR lets the gate read the contracts from this checkout; the name follows the id.
      - name: e2e gate on local (agentage/e2e, a row in its extensions.json)
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true && steps.row.outputs.has == 'true'
        working-directory: e2e-suite
        run: |
          var="$(jq -r .agentage.id ../package.json | tr a-z- A-Z_)_DIR"
          env "$var=$GITHUB_WORKSPACE" npm run e2e -- logs gate local

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true && steps.row.outputs.has == 'true'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '25'
        run: node scripts/assert-executed.mjs

      - name: Logs on failure
        if: failure() || cancelled()
        run: docker compose -f .agentage/compose.json logs --no-color --tail 80 || true
