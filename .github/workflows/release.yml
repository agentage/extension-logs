name: Release

# A v* tag: agentage extension release refuses the starting-point id, a commit off master and a tag that is
# not the version, keeps a released version, then pushes the images and attaches agentage-extension.json
# to the release. The package is private: the estate pins the images and the record, never npm.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Images and record
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts && npm run verify
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node_modules/.bin/agentage extension release # the lockfile's cli, never a fresh resolve
